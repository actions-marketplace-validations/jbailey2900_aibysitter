name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    # Throwaway SQL Server for the score history tests; the password exists only inside this job.
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-only-Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Ci-only-Passw0rd -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    env:
      AIBYSITTER_TEST_SQL: Server=localhost,1433;User Id=sa;Password=Ci-only-Passw0rd;TrustServerCertificate=true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Aibysitter.slnx

      - name: Build
        run: dotnet build Aibysitter.slnx --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test Aibysitter.slnx --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Annotate failed tests
        if: failure()
        run: python3 .github/scripts/annotate-trx.py

  catalogs-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Aibysitter.slnx

      - name: Build
        run: dotnet build Aibysitter.slnx --no-restore --configuration Release -warnaserror

      - name: Catalog tests
        run: dotnet test tests/Aibysitter.Rules.Tests --no-build --configuration Release --filter "Category=Catalog|Category=Hooks" --verbosity normal --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Annotate failed tests
        if: failure()
        run: python .github/scripts/annotate-trx.py

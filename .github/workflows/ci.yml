name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Aibysitter.slnx

      - name: Build
        run: dotnet build Aibysitter.slnx --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test Aibysitter.slnx --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Annotate failed tests
        if: failure()
        shell: python3 {0}
        run: |
          import glob
          import xml.etree.ElementTree as ET

          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}

          def esc_data(value):
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def esc_prop(value):
              return esc_data(value).replace(":", "%3A").replace(",", "%2C")

          for path in glob.glob("TestResults/**/*.trx", recursive=True):
              for result in ET.parse(path).getroot().iterfind(".//t:UnitTestResult[@outcome='Failed']", ns):
                  name = result.get("testName", "unknown test")
                  message = result.findtext("t:Output/t:ErrorInfo/t:Message", "", ns).strip()
                  stack = result.findtext("t:Output/t:ErrorInfo/t:StackTrace", "", ns).strip()
                  stack = "\n".join(stack.splitlines()[:15])
                  body = (message + "\n\n" + stack)[:4000]
                  print(f"::error title={esc_prop('Failed: ' + name)}::{esc_data(body)}")
